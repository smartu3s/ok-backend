                                <h1 className="premium-gradient text-[32px] font-black leading-snug break-keep">마르지 않는 노후 파이프라인:<br/>O.K 캐시플로우 엔진 종합 리포트</h1>
                                <div className="w-[60px] h-[4px] bg-indigo-600 mx-auto my-[30px]"></div>
                                <h3 className="text-base font-medium text-slate-600">안전자산 분산 및 세금 리스크 사전 진단 처방전</h3>
                            </div>
                            <div className="mt-[40mm] bg-blue-50 p-6 rounded-2xl border border-blue-200 text-left">
                                <h3 className="text-blue-900 font-bold text-base mb-3">💡 O.K 캐시플로우 엔진 종합 진단 요약</h3>
                                <p className="text-sm text-blue-800 leading-relaxed m-0 break-keep">현재 고객님의 자산은 상호금융과 배당 ETF로 완벽하게 분산 설계되어, 향후 {plan ? plan.years : 0}년간 <b>약 {plan ? formatManWon(plan.netInterest) : '0원'}</b>의 안정적인 추가 절세 및 배당 수익이 기대됩니다. <b>O.K consulting은 고객님의 평안하고 행복한 노후를 최우선으로 생각합니다.</b></p>
                            </div>
                            <div className="mt-[20mm] bg-slate-50 p-5 rounded-xl border border-slate-200">
                                <div className="text-xs font-bold text-slate-900 mb-2">📢 법적 면책 고지</div>
                                <p className="text-[10px] text-slate-500 leading-relaxed m-0 text-justify">본 보고서는 사용자가 직접 입력한 기초 자산 데이터와 금융 상품 이율 설정을 바탕으로 도출한 시뮬레이션 결과물입니다. 특정 투자 상품 매수 권유나 세무 상담을 대체할 수 없으며, 실제 정산 결과는 금리/세법 변동에 따라 상이할 수 있습니다.</p>
                            </div>
                        </div>
                        <div className="page-footer">- 1 -</div>
                    </div>
                    
                    <div className="print-page">
                        <div className="flex justify-between items-center border-b-2 border-slate-900 pb-2 mb-6">
                            <h2 className="premium-gradient text-2xl font-bold m-0">1. 리스크 정밀 진단 및 종합 성과 평가</h2>
                            <span className="text-xs font-bold text-slate-400">O.K consulting</span>
                        </div>
                        <div className="grid grid-cols-3 gap-4 mb-6">
                            <div className="border border-slate-200 p-4 rounded-xl shadow-sm"><div className="text-[11px] text-slate-500 font-bold mb-1">시뮬레이션 초기 자본금</div><div className="text-lg font-black text-slate-900">{plan ? formatKRW(plan.assets) : '0원'}</div></div>
                            <div className="border border-emerald-200 bg-emerald-50/50 p-4 rounded-xl shadow-sm"><div className="text-[11px] text-emerald-600 font-bold mb-1">{plan ? plan.years : 3}년간 최종순배당 및 순수익</div><div className="text-lg font-black text-emerald-700">{plan ? formatKRW(plan.netInterest) : '0원'}</div></div>
                            <div className="border border-rose-200 bg-rose-50/50 p-4 rounded-xl shadow-sm"><div className="text-[11px] text-rose-600 font-bold mb-1">월생활비</div><div className="text-lg font-black text-rose-700">{plan ? formatKRW(plan.monthlyExpense) : '0원'}</div></div>
                        </div>
                        <h3 className="text-sm font-bold text-slate-800 mb-2.5">🚨 건보료 및 종합과세 방어 전략</h3><div className="text-xs text-slate-600 leading-relaxed bg-red-50 border border-red-100 p-5 rounded-xl mb-6"><p className="mb-2.5">일반 과세 계좌에서 발생하는 이자 및 배당 소득이 연간 <b>1,000만 원</b>을 초과하면 건강보험료 피부양자 자격이 박탈되며, <b>2,000만 원</b> 초과 시 금융소득종합과세 대상이 되어 누진세율이 적용됩니다.</p><p className="m-0">이를 방어하기 위해 현재 포트폴리오는 <b>비과세 종합저축, 중개형 ISA, 정기예금/상호금융 저율과세</b>로 한도를 분산 배정하였습니다. 반드시 다음 페이지의 지침서에 따라 계좌를 분리하여 운영하셔야 세금 폭탄을 피할 수 있습니다.</p></div>
                        <h3 className="text-sm font-bold text-slate-800 mb-2.5">📈 연차별 자산 총액 변동 추이</h3>
                        <table className="w-full text-[11px] border-collapse print-table">
                            <thead><tr><th className="text-center">연차 결산</th><th>기말 자산 평가 총액</th><th>연간 총 발생 이자</th><th>연간 공제 세금</th><th>연간 실질 순수익</th></tr></thead>
                            <tbody>{plan?.yearlyData?.map(y => (<tr key={y.year}><td className="text-center font-bold">{y.year}년차</td><td>{formatKRW(y.totalPrincipal)}</td><td>{formatKRW(y.totalInterest)}</td><td>-{formatKRW(y.totalTax)}</td><td className="font-bold text-indigo-600">{formatKRW(y.netInterest)}</td></tr>))}</tbody>
                        </table><div className="page-footer">- 2 -</div>
                    </div>
                    
                    <div className="print-page">
                        <div className="flex justify-between items-center border-b-2 border-slate-900 pb-2 mb-6">
                            <h2 className="premium-gradient text-2xl font-bold m-0">2. 가족 참여자별 금융 상품 가입 배치</h2>
                            <span className="text-xs font-bold text-slate-400">O.K consulting</span>
                        </div>
                        <p className="text-xs text-slate-500 mb-6">아래의 체크박스에 연필로 체크해가며 은행/증권사 창구 방문 또는 스마트폰 앱을 정밀히 실행하십시오.</p>
                        {plan?.guideByMember && Object.entries(plan.guideByMember).map(([member, accounts], idx) => (<div key={idx} className="mb-6"><div className="text-[15px] font-black text-slate-900 mb-3">👤 {member}</div><div className="space-y-2.5">{accounts.map((a, aIdx) => (<div key={aIdx} className="flex items-center gap-3 bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-[13px]"><div className="text-lg font-bold text-slate-400">[ &nbsp;&nbsp; ]</div><div className="flex-1"><span className="font-bold text-indigo-600">{a.groupKey}</span> 개설 후 ➔ <b>'{a.productName}'</b> <span className="font-black text-rose-600">{formatManWon(a.principal)}</span> 가입/매수하기</div></div>))}</div></div>))}
                        <div className="page-footer">- 3 -</div>
                    </div>
                    
                    <div className="print-page">
                        <div className="flex justify-between items-center border-b-2 border-slate-900 pb-2 mb-6">
                            <h2 className="premium-gradient text-2xl font-bold m-0">3. 미래 현금 흐름도</h2>
                            <span className="text-xs font-bold text-slate-400">O.K consulting</span>
                        </div>
                        <p className="text-xs text-slate-500 mb-4">매월 파킹통장에 배당금과 생활비가 어떻게 순환되며 원금이 안전하게 지켜지는지 보여주는 시뮬레이션 표입니다.</p>
                        <table className="w-full text-[10px] border-collapse print-table">
                            <thead><tr><th className="text-center w-16">경과 월</th><th>월초 잔액</th><th className="text-emerald-700">+ 월 배당/이자</th><th className="text-rose-600">- 월 생활비 지출</th><th className="bg-slate-50">최종 파킹 잔액</th></tr></thead>
                            <tbody>{plan?.monthlyData?.map((mData) => (<tr key={mData.month}><td className="text-center font-bold text-slate-600">{mData.month}개월</td><td>{formatKRW(mData.startingBalance)}</td><td className="text-emerald-600 font-bold">+{formatKRW(mData.dividends + mData.parkingInterest)}</td><td className="text-rose-500">-{formatKRW(mData.withdrawal)}</td><td className="font-black bg-slate-50">{formatKRW(mData.endingBalance)} <span className="text-[9px] text-slate-500 ml-1">+증권금액</span></td></tr>))}</tbody>
                        </table><div className="page-footer">- 4 -</div>
                    </div>
                </div>
                </React.Fragment>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
